<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#181b21;font:600 13px system-ui,sans-serif;color:#dfe5ee}
#labels div{position:absolute;padding:2px 6px;background:#0008;border-radius:4px;white-space:nowrap}
</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<div id="labels"></div>
<script type="module">
// R15 animation previewer.
// Query: anim=Name (anims/<Name>.json)  prop=broken|intact|none (default from anim.prop)  w,h
//   mode=sheet  cols  times=comma list (default: evenly spaced)  views=front,side,...
// window.renderAt(t, view)  -> one view full-frame (for videos)
// window.renderSheet(times, views, cols) -> grid of cells, labelled
import * as THREE from 'three';
import {prepare, sample, fk, mirror} from './anim.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 640, H = +q.get('h') || 640;
const r = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
r.setPixelRatio(1); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.setScissorTest(true);
document.body.appendChild(r.domElement);
r.domElement.style.position = 'absolute'; r.domElement.style.left = '0'; r.domElement.style.top = '0';

const sc = new THREE.Scene();
sc.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3328, 1.6));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2);
sun.position.set(4, 10, -6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, {left: -5, right: 5, top: 7, bottom: -3, near: 1, far: 30});
sc.add(sun, sun.target);
// ground with 1-stud grid
const gtex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#7d6d58'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#6a5b48'; g.lineWidth = 2; g.strokeRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({map: gtex, roughness: 1}));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; sc.add(ground);
// forward arrow on the ground (character faces -Z)
const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.5, 3), new THREE.MeshBasicMaterial({color: 0xffd34d}));
arrow.rotation.x = -Math.PI / 2; arrow.position.set(0, 0.02, -1.6); sc.add(arrow);

const get = async p => (await fetch(p)).json();
const rig = await get('../rig_r15.json');
const animName = q.get('anim');
let animSrc;
if (animName) {
  try { animSrc = await get(`../anims/${animName}.json`); }
  catch (e) {
    // <Name>Right variants are generated by mirroring <Name>
    const base = animName.replace(/Right$/, '');
    animSrc = mirror(await get(`../anims/${base}.json`), animName);
  }
}
const prep = animSrc ? prepare(animSrc, rig) : null;

// ---- rig meshes ----
const meshes = {};
for (const [name, p] of Object.entries(rig.parts)) {
  if (p.hidden) continue;
  // Display only: R15 limb boxes overlap at the joints, so draw lower segments a little slimmer to avoid z-fighting.
  const k = /LowerArm|LowerLeg/.test(name) ? 0.93 : /Hand/.test(name) ? 0.86 : /UpperArm|UpperLeg/.test(name) ? 0.985 : 1;
  const ky = /Hand/.test(name) ? 1.15 : 1;
  const m = new THREE.Mesh(new THREE.BoxGeometry(p.size[0] * k, p.size[1] * ky, p.size[2] * k), new THREE.MeshStandardMaterial({color: p.color, roughness: 0.8}));
  m.castShadow = m.receiveShadow = true; m.matrixAutoUpdate = false; sc.add(m); meshes[name] = m;
  if (p.face) {   // eyes + mouth on the front (-Z) face
    const mat = new THREE.MeshBasicMaterial({color: 0x1b1410});
    for (const x of [-0.22, 0.22]) { const e = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.2, 0.02), mat); e.position.set(x, 0.12, -p.size[2] / 2 - 0.005); m.add(e); }
    const mo = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.06, 0.02), mat); mo.position.set(0, -0.2, -p.size[2] / 2 - 0.005); m.add(mo);
  }
}
// ---- prop in the right hand ----
const propName = q.get('prop') ?? animSrc?.prop ?? 'none';
const propFile = {broken: 'Intro_BrokenSword', intact: 'StarterSword'}[propName];
const prop = new THREE.Group(); prop.matrixAutoUpdate = false; sc.add(prop);
if (propFile) {
  const spec = await get(`../props/${propFile}.json`);
  for (const pt of spec.parts) prop.add(partMesh(pt));
}
function partMesh(pt) {
  let geo;
  const [sx, sy, sz] = pt.size;
  if (pt.class === 'WedgePart') {
    // Roblox wedge: full bottom, vertical back face (+Z), slope rising from the front-bottom to the back-top.
    const s = new THREE.Shape(); s.moveTo(-sz / 2, -sy / 2); s.lineTo(sz / 2, -sy / 2); s.lineTo(sz / 2, sy / 2); s.closePath();
    geo = new THREE.ExtrudeGeometry(s, {depth: sx, bevelEnabled: false});
    geo.translate(0, 0, -sx / 2); geo.rotateY(-Math.PI / 2);   // shape x -> part z, extrude -> part x
  } else if (pt.shape === 'Ball') geo = new THREE.SphereGeometry(Math.min(sx, sy, sz) / 2, 16, 12);
  else if (pt.shape === 'Cylinder') { geo = new THREE.CylinderGeometry(Math.min(sy, sz) / 2, Math.min(sy, sz) / 2, sx, 14); geo.rotateZ(-Math.PI / 2); }
  else geo = new THREE.BoxGeometry(sx, sy, sz);
  const metal = pt.material === 'Metal' || pt.material === 'CorrodedMetal';
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: new THREE.Color(`rgb(${pt.color.join(',')})`), metalness: metal ? 0.55 : 0, roughness: metal ? 0.35 : 0.85,
    transparent: !!pt.transparency, opacity: 1 - (pt.transparency || 0)}));
  m.castShadow = true;
  m.position.set(...pt.pos);
  if (pt.rot) m.rotation.set(...pt.rot.map(v => v * Math.PI / 180), 'XYZ');
  return m;
}

// ---- cameras: the character faces -Z, its right is +X ----
const VIEWS = {
  front: {pos: [4.6, 3.9, -11.2], look: [0, 2.5, 0]},    // 3/4 front, from the character's right
  front0: {pos: [0, 3.2, -12.4], look: [0, 2.5, 0]},     // straight on (what the camera/player sees)
  frontl: {pos: [-4.6, 3.9, -11.2], look: [0, 2.5, 0]},  // 3/4 front, from the character's left
  side: {pos: [12.4, 2.9, 0], look: [0, 2.5, 0]},        // from the character's right; it faces screen-right
  left: {pos: [-12.4, 2.9, 0], look: [0, 2.5, 0]},
  back: {pos: [-4.6, 4.2, 11.2], look: [0, 2.5, 0]},
  top: {pos: [0.01, 15, -1], look: [0, 1.5, 0]},
  close: {pos: [2.6, 4.0, -7.0], look: [0, 3.0, 0]},
};
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
function setView(v, aspect) {
  const d = VIEWS[v] || VIEWS.front;
  cam.aspect = aspect; cam.position.set(...d.pos); cam.lookAt(...d.look); cam.updateProjectionMatrix();
}
function pose(t) {
  const poses = prep ? sample(prep, t) : {};
  const w = fk(rig, poses);
  for (const [n, m] of Object.entries(meshes)) m.matrix.copy(w[n]);
  prop.matrix.copy(w.__grip);
  return w;
}
const labels = document.getElementById('labels');
function label(x, y, text) { const d = document.createElement('div'); d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = text; labels.appendChild(d); }

window.renderAt = (t, view = 'front') => {
  labels.innerHTML = '';
  pose(t); setView(view, W / H);
  r.setViewport(0, 0, W, H); r.setScissor(0, 0, W, H); r.setClearColor(0x181b21); r.clear(); r.render(sc, cam);
  if (q.get('stamp') !== '0') label(8, 8, `${animName || 'rest'}  t=${t.toFixed(2)}s  ${view}`);
};
window.renderSheet = (times, views, cols) => {
  labels.innerHTML = '';
  const rows = Math.ceil(times.length / cols) * views.length;
  const cw = Math.floor(W / cols), ch = Math.floor(H / rows);
  r.setClearColor(0x181b21); r.setViewport(0, 0, W, H); r.setScissor(0, 0, W, H); r.clear();
  times.forEach((t, i) => {
    const col = i % cols, band = Math.floor(i / cols);
    views.forEach((v, vi) => {
      const row = band * views.length + vi;
      const x = col * cw, y = H - (row + 1) * ch;
      pose(t); setView(v, cw / ch);
      r.setViewport(x, y, cw, ch); r.setScissor(x, y, cw, ch); r.render(sc, cam);
      if (vi === 0) label(x + 4, row * ch + 4, `t=${t.toFixed(2)}`);
      if (col === 0) label(x + 4, row * ch + ch - 24, v);
    });
  });
};
window.info = prep ? {length: prep.length, loop: prep.loop, keys: prep.keys.map(k => k.t)} : {length: 0};
window.ready = true;
</script></body></html>
